name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash tools/check.sh
        env:
          KOTO_CORE_DIR: /nonexistent-private-core
  android:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
      - run: sdkmanager 'ndk;26.3.11579264'
      - shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          export KOTO_SDK_INCLUDE="$GITHUB_WORKSPACE/sdk/include"
          bash tools/build_all_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kote-modules-android-arm64-${{ github.sha }}
          path: dist/android-arm64-v8a/
          if-no-files-found: error
          retention-days: 30
